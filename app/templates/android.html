{% extends "base.html" %}
{% block title %}Android — Kaspi AutoPrice{% endblock %}
{% block content %}
<section class="hero-card">
  <p class="eyebrow">Android</p>
  <h1>Установка на телефон</h1>
  <p class="big">Откройте сайт в Chrome и нажмите “Установить приложение”.</p>
  <div class="hero-actions"><button class="btn btn-primary" data-install-app>Установить</button><a class="btn btn-soft" href="/automation">Автопилот</a></div>
</section>
<section class="premium-card">
  <div class="card-head"><div><p class="eyebrow">URL</p><h2>Текущая ссылка</h2></div></div>
  <div class="copy-box"><code id="app-url">{{ base_url }}</code><button class="btn btn-small" type="button" data-copy="#app-url">Копировать</button></div>
</section>
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
document.querySelector('[data-install-app]')?.addEventListener('click', async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
  else { alert('Откройте сайт в Chrome на Android → меню ⋮ → Установить приложение.'); }
});
</script>
{% endblock %}
