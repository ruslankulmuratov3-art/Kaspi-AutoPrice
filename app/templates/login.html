{% extends "base.html" %}
{% block title %}Вход — Kaspi AutoPrice{% endblock %}
{% block content %}
<section class="login-page">
  <form class="premium-card login-card form" method="post" action="/login">
    <p class="eyebrow">Kaspi AutoPrice</p>
    <h2>Вход</h2>
    <label>Логин<input name="username" placeholder="admin" required></label>
    <label>Пароль<input name="password" type="password" placeholder="Введите пароль" required></label>
    <button class="btn btn-primary btn-wide">Войти</button>
  </form>
</section>
{% endblock %}
